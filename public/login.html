<!DOCTYPE html> 
<html lang="en"> 
 
<head> 
    <meta charset="UTF-8"> 
 
    <meta 
        name="viewport" 
        content="width=device-width,initial-scale=1.0" 
    > 
 
    <meta 
        name="description" 
        content="Official sign-in page for the DevT Development Tracker project and task management system." 
    > 
 
    <title>DevT | Sign In</title> 
 
    <link 
        rel="icon" 
        type="image/png" 
        href="/images/DT%20LOGO.png" 
    > 
 
    <link 
        rel="stylesheet" 
        href="/css/login.css" 
    > 
</head> 
 
<body> 
 
    <main class="login-shell"> 
 
        <section class="login-card"> 
 
            <div class="login-brand"> 
 
                <img 
                    src="/images/DT%20LOGO.png" 
                    alt="DevT Development Tracker logo" 
                > 
 
                <div> 
                    <h1>DevT</h1> 
                    <p>Development Tracker</p> 
                </div> 
 
            </div> 
 
 
            <div class="login-heading"> 
 
                <h2>Welcome back</h2> 
 
                <p> 
                    Sign in using your DevT account to access your 
                    assigned projects and tasks. 
                </p> 
 
            </div> 
 
 
            <form 
                id="loginForm" 
                autocomplete="on" 
            > 
 
                <label> 
                    Username 
 
                    <input 
                        type="text" 
                        id="fullName" 
                        name="username" 
                        autocomplete="username" 
                        required 
                        placeholder="Enter your DevT username" 
                    > 
                </label> 
 
 
                <label> 
                    Password 
 
                    <div class="password-field"> 
 
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            autocomplete="current-password" 
                            required 
                            placeholder="Enter your DevT password" 
                        > 
 
                        <button 
                            type="button" 
                            id="togglePassword" 
                            aria-label="Show password" 
                        > 
                            Show 
                        </button> 
 
                    </div> 
 
                </label> 
 
 
                <div 
                    id="loginError" 
                    class="login-error" 
                    aria-live="polite" 
                ></div> 
 
 
                <button 
                    type="submit" 
                    class="login-btn" 
                    id="loginBtn" 
                > 
                    Sign In 
                </button> 
 
            </form> 
 
 
            <p class="login-access-note"> 
                Authorized DevT users only. 
            </p> 
 
        </section> 
 
    </main> 
 
 
    <script src="/js/login.js"></script> 
 
</body> 
 
</html>
